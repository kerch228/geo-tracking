[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a real PostgreSQL/PostGIS database",
    "load: local concurrency benchmark",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
